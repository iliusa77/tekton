apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build
spec:
  workspaces:
    - name: source

  steps:
    - name: build
      image: alpine:3.20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh

        echo "Building application..."

        mkdir -p build

        cp app.sh build/

        echo "Build completed!"

        ls -la build/