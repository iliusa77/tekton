apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-tests
spec:
  workspaces:
    - name: source

  steps:
    - name: test
      image: alpine:3.20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh

        echo "Running tests..."

        if [ -f app.sh ]; then
          echo "app.sh exists"
        else
          echo "ERROR: app.sh not found"
          exit 1
        fi

        echo "Tests passed!"